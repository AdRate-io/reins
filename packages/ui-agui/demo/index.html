<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>reins · AG-UI 最小页面</title>
<style>
  :root { --bg: #f6f5f1; --ink: #1c1b18; --mute: #7a766c; --line: #e2dfd6; --user: #dbe7ff; --model: #ffffff; --tool: #fff4d6; --warn: #ffe0e0; --chip: #ecebe4; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; gap: 12px; align-items: baseline; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--mute); font-size: 12px; }
  header .meta b { color: var(--ink); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 49px); }
  #chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  #messages { flex: 1; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--model); }
  .msg.reasoning { align-self: flex-start; background: transparent; color: var(--mute); font-size: 12px; border-style: dashed; }
  .msg.reasoning summary { cursor: pointer; }
  .tool { align-self: flex-start; max-width: 72%; background: var(--tool); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 12px; }
  .tool code { display: block; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tool .result { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .tool .result.error { color: #a12; }
  .chip { align-self: center; font-size: 11px; color: var(--mute); background: var(--chip); border-radius: 999px; padding: 2px 10px; }
  .approval { align-self: stretch; background: var(--warn); border: 1px solid #f3b7b7; border-radius: 12px; padding: 12px 14px; }
  .approval button { margin-right: 8px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .approval button.ok { background: #1c1b18; color: #fff; border-color: #1c1b18; }
  form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: #fff; }
  textarea { flex: 1; resize: none; height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  button.send { padding: 0 18px; border-radius: 10px; border: none; background: #1c1b18; color: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  aside { display: flex; flex-direction: column; }
  aside h2 { font-size: 12px; color: var(--mute); margin: 0; padding: 12px 16px 6px; text-transform: uppercase; letter-spacing: .06em; }
  aside .actions { padding: 0 16px 8px; display: flex; gap: 8px; }
  aside .actions button { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  #timeline { flex: 1; overflow: auto; margin: 0; padding: 0 16px 16px; list-style: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  #timeline li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--mute); }
  #timeline li b { color: var(--ink); font-weight: 500; text-align: right; }
  #timeline li.replay { opacity: .6; }
  #status { font-size: 12px; color: var(--mute); padding: 0 20px 8px; }
</style>
</head>
<body>
<header>
  <h1>reins</h1>
  <span class="meta">会话 <b id="sid">—</b> · 已收到 seq <b id="lastseq">0</b> · <span id="run">空闲</span></span>
</header>
<main>
  <section id="chat">
    <div id="messages"></div>
    <div id="status"></div>
    <form id="form">
      <textarea id="input" placeholder="问问上海天气，或者说“把版本上线到 prod”看看审批流程。Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="send" type="submit">发送</button>
    </form>
  </section>
  <aside>
    <h2>时间线（唯一真源）</h2>
    <div class="actions">
      <button id="replay" type="button" title="用 GET + lastSeq 从服务端日志补发，模拟断线重连">重连补发</button>
      <button id="reset" type="button">新会话</button>
    </div>
    <ul id="timeline"></ul>
  </aside>
</main>

<script>
/**
 * 消费 @reins/server + @reins/ui-agui 吐出的 AG-UI 事件流。只用 fetch 与 TextDecoder，没有任何依赖。
 * 状态只有三样：sessionId、lastSeq（SSE 帧的 id）、当前挂起的审批（RUN_FINISHED 的 interrupt outcome）。
 */
const $ = (id) => document.getElementById(id)
const state = { sessionId: null, lastSeq: 0, pending: null, busy: false }
const byId = new Map() // messageId / toolCallId → DOM 节点

function setStatus(text) { $("run").textContent = text }
function scroll() { $("messages").scrollTop = $("messages").scrollHeight }
function el(tag, cls, text) {
  const n = document.createElement(tag)
  if (cls) n.className = cls
  if (text !== undefined) n.textContent = text
  return n
}

// ---- 解析 SSE：按空行切帧，data 是 JSON，id 是 seq ----
async function* frames(response) {
  const reader = response.body.getReader()
  const decoder = new TextDecoder()
  let buf = ""
  while (true) {
    const { done, value } = await reader.read()
    if (done) return
    buf += decoder.decode(value, { stream: true })
    const blocks = buf.split("\n\n")
    buf = blocks.pop()
    for (const block of blocks) {
      const frame = {}
      for (const line of block.split("\n")) {
        if (line.startsWith("id: ")) frame.id = Number(line.slice(4))
        else if (line.startsWith("data: ")) frame.data = JSON.parse(line.slice(6))
      }
      if (frame.data) yield frame
    }
  }
}

// ---- AG-UI 事件 → 界面 ----
function render(e, replay) {
  const reins = e.metadata?.reins
  if (reins?.seq !== undefined) addTimeline(reins, replay)
  switch (e.type) {
    case "RUN_STARTED":
      setStatus(e.metadata?.reins?.live ? "运行中…" : "补发中…")
      break
    case "TEXT_MESSAGE_START": {
      const n = el("div", `msg ${e.role}`)
      byId.set(e.messageId, n)
      $("messages").append(n)
      break
    }
    case "TEXT_MESSAGE_CONTENT":
      byId.get(e.messageId)?.append(e.delta)
      scroll()
      break
    case "REASONING_START": {
      const d = el("details", "msg reasoning")
      d.append(el("summary", null, "思考"), el("div"))
      byId.set(e.messageId, d)
      $("messages").append(d)
      break
    }
    case "REASONING_MESSAGE_CONTENT":
      byId.get(e.messageId)?.lastChild.append(e.delta)
      break
    case "TOOL_CALL_START": {
      const n = el("div", "tool")
      n.append(el("div", null, `🔧 ${e.toolCallName}`), el("code"))
      byId.set(e.toolCallId, n)
      $("messages").append(n)
      break
    }
    case "TOOL_CALL_ARGS":
      byId.get(e.toolCallId)?.querySelector("code").append(e.delta)
      break
    case "TOOL_CALL_RESULT": {
      const card = byId.get(e.toolCallId)
      if (!card) break
      const r = el("div", `result${e.metadata?.reins?.isError ? " error" : ""}`, `→ ${e.content}`)
      card.append(r)
      scroll()
      break
    }
    case "CUSTOM": {
      // reins 特有事件：审批请求、感知、预算、暂停恢复…… 这里只显示成一枚小标签，完整内容在右侧时间线
      const label = e.name.replace("core.", "")
      const detail = e.name === "core.approval_request" ? `：${e.value.payload.summary}` : ""
      $("messages").append(el("span", "chip", label + detail))
      break
    }
    case "RUN_FINISHED": {
      const r = e.result
      if (e.outcome?.type === "interrupt") {
        setStatus(`暂停：${r.reason}`)
        const approvals = e.outcome.interrupts.filter((i) => i.reason === "approval")
        if (approvals.length && r.state) showApproval(r, approvals)
      } else {
        setStatus(r?.status === "replayed" ? "补发完成" : `完成（${r?.status}）`)
      }
      break
    }
    case "RUN_ERROR":
      setStatus(`出错：${e.message}`)
      $("messages").append(el("div", "approval", `RUN_ERROR ${e.code ?? ""} ${e.message}`))
      break
  }
}

function addTimeline(reins, replay) {
  // 同一个事件可能翻成多条 AG-UI 事件，时间线每个 seq 只列一次
  if (document.querySelector(`#timeline li[data-seq="${reins.seq}"]`)) return
  const li = el("li", replay ? "replay" : "")
  li.dataset.seq = reins.seq
  li.append(el("b", null, String(reins.seq)), el("span", null, reins.type.replace("core.", "")))
  $("timeline").append(li)
  $("timeline").scrollTop = $("timeline").scrollHeight
}

function showApproval(result, approvals) {
  const box = el("div", "approval")
  const call = approvals[0].metadata?.call
  box.append(el("div", null, `需要你审批：${approvals[0].message}`), el("code", null, JSON.stringify(call?.args ?? {})))
  const row = el("div")
  const ok = el("button", "ok", "批准")
  const no = el("button", null, "拒绝")
  row.append(ok, no)
  box.append(row)
  $("messages").append(box)
  scroll()
  const decide = (approved) => {
    ok.disabled = no.disabled = true
    box.append(el("div", null, approved ? "已批准，继续跑…" : "已拒绝"))
    send({
      sessionId: state.sessionId,
      lastSeq: state.lastSeq,
      resume: result.state,
      decisions: approvals.map((a) => ({ toolCallId: a.toolCallId, approved, by: "boss" })),
    })
  }
  ok.onclick = () => decide(true)
  no.onclick = () => decide(false)
}

// ---- 发请求：POST 起 run；GET 补发 ----
async function consume(response, replay) {
  const sid = response.headers.get("x-reins-session")
  if (sid) { state.sessionId = sid; $("sid").textContent = sid }
  for await (const f of frames(response)) {
    if (f.id !== undefined) { state.lastSeq = f.id; $("lastseq").textContent = f.id }
    render(f.data, replay)
  }
}

async function send(body) {
  if (state.busy) return
  state.busy = true
  $("send").disabled = true
  $("status").textContent = ""
  try {
    const res = await fetch("/agent", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    if (!res.ok) {
      const err = await res.json().catch(() => ({}))
      $("status").textContent = `HTTP ${res.status} ${err.error ?? ""} ${err.message ?? ""}`
      return
    }
    await consume(res, false)
  } catch (err) {
    $("status").textContent = `请求失败：${err.message}`
  } finally {
    state.busy = false
    $("send").disabled = false
  }
}

$("form").onsubmit = (ev) => {
  ev.preventDefault()
  const text = $("input").value.trim()
  if (!text) return
  $("input").value = ""
  send({ sessionId: state.sessionId ?? undefined, input: text, lastSeq: state.lastSeq })
}
$("input").onkeydown = (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit() }
}
$("replay").onclick = async () => {
  if (!state.sessionId) return
  // 清空界面，只凭 sessionId 从服务端日志重放全部：证明界面上的一切都能从时间线重建
  $("messages").replaceChildren(); $("timeline").replaceChildren(); byId.clear()
  const res = await fetch(`/agent?sessionId=${encodeURIComponent(state.sessionId)}&lastSeq=0`)
  await consume(res, true)
}
$("reset").onclick = () => {
  state.sessionId = null; state.lastSeq = 0; byId.clear()
  $("sid").textContent = "—"; $("lastseq").textContent = "0"; setStatus("空闲")
  $("messages").replaceChildren(); $("timeline").replaceChildren()
}
</script>
</body>
</html>
