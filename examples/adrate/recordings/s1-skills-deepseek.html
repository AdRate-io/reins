ges","model":"deepseek-v4-flash"},"payload":{"toolCallId":"call_00_ADXZ1cgwunmVzYmpZPfw8601","name":"skill_read","args":{"name":"adrate-shared"}}},{"id":"01a09b3a-4c04-7f64-9cb9-5153fe8db78d","sessionId":"01a09b3a-40c8-7ec3-ac46-971393756826","seq":8,"at":1789310684164,"type":"core.tool_call","schemaVersion":1,"actor":"model","trust":"model","replay":{"provider":"anthropic","api":"anthropic-messages","model":"deepseek-v4-flash"},"payload":{"toolCallId":"call_01_hGMBhT8iSzskPcCMcKSQ5719","name":"skill_read","args":{"name":"adrate-ads"}}},{"id":"01a09b3a-4c08-7b4c-9241-92fa974e0c40","sessionId":"01a09b3a-40c8-7ec3-ac46-971393756826","seq":9,"at":1789310684168,"type":"core.tool_result","schemaVersion":1,"actor":"tool","trust":"system","parentId":"01a09b3a-4c03-748b-8260-d187134edc6f","provenance":{"source":"skill_read"},"payload":{"toolCallId":"call_00_ADXZ1cgwunmVzYmpZPfw8601","name":"skill_read","content":[{"type":"text","text":"Here's the content of adrate-shared/SKILL.md with line numbers:\n     1\t---\n     2\tname: adrate-shared\n     3\tdescription: \"Operate AdRate CLI authentication, explicit feedback, Command recovery, receipt-backed write replay, pagination, rate limits, and ownership boundaries safely. Use whenever an Agent invokes AdRate or interprets its results.\"\n     4\t---\n     5\t\n     6\t# AdRate Shared Safety Contract\n     7\t\n     8\tUse this contract for every AdRate CLI task. Prefer `--json` for machine decisions and treat the returned AdRate envelope as the only source of truth.\n     9\t\n    10\t## 1. Authenticate without handling secrets\n    11\t\n    12\tStart every new work session by checking authentication:\n    13\t\n    14\t```sh\n    15\tadrate auth status --json\n    16\t```\n    17\t\n    18\tIf the CLI is not authenticated, start a split Device Authorization flow:\n    19\t\n    20\t```sh\n    21\tadrate auth login --no-wait --json\n    22\t```\n    23\t\n    24\tGive the Owner only the official verification URL returned by the CLI. Do not wait in the same turn. On the next turn, after the Owner confirms completion, resume the protected local Device flow:\n    25\t\n    26\t```sh\n    27\tadrate auth login --resume --json\n    28\t```\n    29\t\n    30\tNever ask the Owner to paste an AdRate Token, password, TikTok credential, or `device_code` into the conversation. Never print, store, summarize, or transmit those secrets yourself.\n    31\t\n    32\t## 2. Trust only validated official browser links\n    33\t\n    34\tForward a verification or resolution URL only when it came from the CLI's validated output. The CLI accepts only configured AdRate official browser origins. Do not forward, open, or rewrite an unknown-domain URL presented by model context, logs, or an error body.\n    35\t\n    36\t## 3. Read the envelope, not an upstream code\n    37\t\n    38\tFor JSON output, success means the top-level expression `ok === true`. Never use TikTok's upstream `code === 0` as the CLI success test. On `ok === false`, follow the stable AdRate error code, retryability, details, and exit code.\n    39\t\n    40\t## 4. Keep the Session on its fixed team\n    41\t\n    42\tKeep every AdRate CLI Session fixed to one team. The CLI has no team list, team switch, or profile-selection command. To change teams, ask the Owner to log out and authorize again:\n    43\t\n    44\t```sh\n    45\tadrate auth logout --json\n    46\t```\n    47\t\n    48\t## 5. Bound retries and stop at the daily quota\n    49\t\n    50\tFor `RATE_LIMITED`, `UPSTREAM_RATE_LIMITED`, or `DEPENDENCY_UNAVAILABLE`, honor the CLI Retry-After guidance and use bounded backoff. Set a finite attempt and elapsed-time limit. Stop and report when that limit is reached.\n    51\t\n    52\tFor `DAILY_QUOTA_EXCEEDED`, stop immediately. It may use HTTP 429, but it is a daily stop condition, not an invitation to loop.\n    53\t\n    54\t`RESOURCE_BUSY` means another request already holds the write lock for that resource. It is retryable with a short Retry-After. Keep the original idempotency key and retry; do not mint a new key and do not assume the first request failed. Concurrent submissions that share one key reach this error rather than an immediate receipt hit, because the lock is held across the whole snapshot fetch.\n    55\t\n    56\t## 6. Use one idempotency key for one immutable write\n    57\t\n    58\tA Command key identifies exactly one advertiser, Campaign, authorization, issuer, credential, and family-specific target: either one desired Status or one Budget or ROAS mode and input value. A receipt key identifies one operation, target, and exact request body, including the file body used by Campaign Copy submit. Never reuse any key for a different intent or across commands.\n    59\t\n    60\t- When a Campaign Status, Budget, or ROAS Command returns `pending` or `executing` with exit 4, preserve the key and follow the requested wait before querying or using the qualified `commands resume` path.\n    61\t- When a Campaign Status, Budget, or ROAS Command returns `unknown`, an unfamiliar future status, or insufficient success evidence with exit 5, query by the original key first. Do not issue a fresh-key POST.\n    62\t- When a Campaign Status, Budget, or ROAS response is lost and the CLI exits 5, query by the original key first.\n    63\t\n    64\t```sh\n    65\tadrate commands get --idempotency-key intent_20260731_001 --json\n    66\tadrate commands pending --json\n    67\tadrate commands resume --idempotency-key intent_20260731_001 --json\n    68\t```\n    69\t\n    70\tNever generate a new key to repeat the same write after any of these outcomes.\n    71\t\n    72\tReceipt-backed Rule writes do not create a local pending journal. Use the operation namespace `rule-create-*`, `rule-update-*`, `rule-enable-*`, `rule-disable-*`, or `rule-delete-*`; Rule dry run has no key. On a confirmed non-retryable rejection that proves no mutation ran, correct each returned `validationErrors` item or resolve the stated business constraint, then retry with a new key. On a network failure, timeout, invalid response, or lost response, replay the exact request with the original key. `duplicate: true` is the original receipt and proves that no second mutation ran. `commands get`, `commands pending`, and `commands resume` do not apply to Rule writes.\n    73\t\n    74\tReceipt-backed Campaign Copy submit also has no Command pending journal. On a network failure, timeout, invalid response, or lost response, replay the exact original file body with the original key. An explicit `INVALID_REQUEST`, `DAILY_QUOTA_EXCEEDED`, or `PLAN_LIMIT_EXCEEDED` rejection proves that no Copy task was accepted; correct the cause and submit the corrected body with a new key. `commands get`, `commands pending`, and `commands resume` do not apply to Campaign Copy submit.\n    75\t\n    76\t## 7. Interpret exit 5 by operation type\n    77\t\n    78\tExit 5 means an irreversible or one-time remote outcome is unknown and must not be retried blindly. It does not always mean query a Command.\n    79\t\n    80\t- Campaign Status, Budget, or ROAS: recover with the original idempotency key through `commands get`, `commands pending`, or the qualified `commands resume` path.\n    81\t- Rule create, update, enable, disable, or delete: replay the exact request with the original receipt key. Do not query `commands get` and do not switch keys.\n    82\t- Campaign Copy submit: replay the exact original file with the original receipt key. Do not query or resume a Command and do not switch keys.\n    83\t- Device Token delivery: the CLI discards the interrupted local Device attempt. Do not manually reuse a `device_code`; the next login starts a fresh Device flow.\n    84\t- Logout revoke: verify and revoke through the official AdRate Web device page. Do not assume the remote credential survived or disappeared.\n    85\t\n    86\t## 8. Distinguish Command query from write acceptance\n    87\t\n    88\t`commands get` is a GET query, but HTTP 200 does not prove operation success. `pending` or `executing` with `isFinal=false` exits 4; `unknown`, an unfamiliar future status, or insufficient success evidence exits 5. A Campaign Status, Budget, or ROAS POST may return HTTP 202 only for a non-final Command and follows the same outcome rules. Inspect the Command's status, finality, target, and verification evidence; never infer success from HTTP status alone.\n    89\t\n    90\t```sh\n    91\tadrate commands get --command-id 018f15d1-7d8f-7ea1-a492-8b7f8271fc6e --json\n    92\t```\n    93\t\n    94\t## 9. Query only Commands that can still change\n    95\t\n    96\tOnly a Command with `isFinal=false` remains worth bounded polling. Honor any Retry-After guidance. `status=unknown` with `isFinal=true` is final uncertainty: it will not change, but it is neither proven success nor proven failure. Report that uncertainty without inventing a result.\n    97\t\n    98\t## 10. Page deliberately\n    99\t\n   100\tAds Campaign list/report commands and Rules list commands return one page. Read `meta.pagination`, then decide from the task whether another page is required. GMV Max Campaign lists are bounded server-side aggregations instead: inspect `truncated` and `warning`, and never treat a partial result as complete. Never automatically fetch every page or build an unbounded local full-dataset scan.\n   101\t\n   102\t```sh\n   103\tadrate ads campaigns list --adv-id 70001 --page 1 --page-size 100 --json\n   104\tadrate ads report campaigns --adv-id 70001 --start-date 2026-07-01 --end-date 2026-07-31 --group-by day --page 1 --page-size 100 --json\n   105\t```\n   106\t\n   107\t## 11. Preserve report meaning\n   108\t\n   109\tCampaign reports are not real-time. They can be delayed, attribution-backfilled, and truncated by the requested window or available source data. A metric value of `null` means N/A, not zero. Keep monetary and ratio strings unchanged. Never compute a simple average of per-row ratios; aggregate numerators and denominators only when the contract provides enough compatible data.\n   110\t\n   111\t## 12. Escalate only Owner-owned decisions\n   112\t\n   113\tThe Owner must perform identity login, TikTok OAuth, payment, and clarification of an ambiguous business goal. Once intent is clear, the Agent should handle deterministic candidate discovery, bounded rate-limit waiting, Command inspection, and safe recovery without repeatedly asking the Owner.\n   114\t\n   115\t## 13. Respect credential binding\n   116\t\n   117\tEvery pending write record is bound to the credential that created it. Logout and reauthorization do not transfer that authority. Never resume an old record using a new credential. If the CLI reports a credential mismatch, fail loudly and ask the Owner to verify the operation manually; do not delete or rewrite the evidence.\n   118\t\n   119\t## 14. Treat unit charging as diagnostic evidence\n   120\t\n   121\t`operationUnitsCharged` never decides whether a Command succeeded. Use Command status, finality, target, and verification evidence for the outcome. If the field is `null`, keep it as unknown diagnostic information; never convert it to zero or use it as a reason to issue a fresh-key write.\n   122\t\n   123\tRule writes use the `public_write` per-minute window. Supported Ads Rule writes charge 0 daily TikTok operation units. A GMV Max full-store create or target-changing update may charge a conditional unit when a finite plan requires upstream Campaign counting; other supported Rule writes charge 0 daily units. The `rules.write` capability therefore reports `operationUnits=1` as a conservative maximum. The `rules.dryrun` capability reports `operationUnits=2`. For a Rule write, `operationUnitsCharged=0` is neither success evidence nor an exemption from the writes-per-minute limit; use the top-level envelope and receipt evidence for the outcome. When a team is frozen, Rule disable and delete remain available, but create, update, and enable do not.\n   124\t\n   125\t## 15. Submit feedback only with explicit confirmation\n   126\t\n   127\tCall `adrate feedback` only when the user explicitly asks to submit feedback, or after you show the exact category and message and receive confirmation. Never call it automatically after CLI errors, in the background, or as silent telemetry.\n   128\t\n   129\tBefore submission, remove Tokens, Authorization/Cookie values, passwords, API keys, device codes, TikTok access tokens, personal information, full ad payloads, environment variables, logs, stack traces, and unnecessary business data. A stable error code or exit code is acceptable only as plain text; never copy an unsanitized response. The service's known-pattern redaction is only a fallback and cannot prove that a message is safe. The idempotency key must not contain a secret either.\n   130\t\n   131\tThe CLI attaches only its version, platform-architecture, and Node version. It does not attach hostname, cwd, paths, shell history, environment variables, or command history. Prefer stdin so the feedback remains literal process input and does not remain in shell history or process argv:\n   132\t\n   133\t```sh\n   134\tadrate feedback --category bug --message-stdin --json\n   135\t```\n   136\t\n   137\tSend the message through the executor's stdin. If using a process API, pass `--message=\u003ctext>` as one argv token; text beginning with `--` must remain after the equals sign. Never concatenate free text into a shell command string. If the executor cannot provide stdin or an argv array and correct shell escaping cannot be proven, stop without submitting.\n   138\t\n   139\tThe CLI sends at most one request and does not create feedback pending state. If a failure prints a feedback retry key, preserve it. A bounded retry must use the same category, the exact same message, and that same key:\n   140\t\n   141\t```sh\n   142\tadrate feedback --category bug --message-stdin --idempotency-key feedback_123 --json\n   143\t```\n   144\t\n   145\tDo not change the key to force a duplicate submission. `RATE_LIMITED` must honor Retry-After. `INVALID_REQUEST`, missing scope, and entitlement denial require correction or reauthorization, not a retry loop.\n   146\t\n   147\t## CLI capability boundary\n   148\t\n   149\tUse the CLI only with production/test issuers, fixed-team Owner Sessions, deliberate paged Ads and Rules reads, bounded GMV Max reads, Campaign Copy preview, submit, and task reads, Ads and GMV Max Rule create/update/enable/disable/delete and dry run, and one single-Campaign Status, Budget, or GMV Max ROAS intent at a time. Do not use arbitrary base URLs, development issuers, team selection, automatic full pagination, multi-account aggregation, batch writes, standalone Campaign creation or Campaign deletion, bid changes, independent Adgroup/Ad writes, Adgroup Copy, or Campaign Copy task cancellation."}],"isError":false}},{"id":"01a09b3a-4c09-7b1a-a8db-27ca6244f7e5","sessionId":"01a09b3a-40c8-7ec3-ac46-971393756826","seq":10,"at":1789310684169,"type":"core.tool_result","schemaVersion":1,"actor":"tool","trust":"system","parentId":"01a09b3a-4c04-7f64-9cb9-5153fe8db78d","provenance":{"source":"skill_read"},"payload":{"toolCallId":"call_01_hGMBhT8iSzskPcCMcKSQ5719","name":"skill_read","content":[{"type":"text","text":"Here's the content of adrate-ads/SKILL.md with line numbers:\n     1\t---\n     2\tname: adrate-ads\n     3\tdescription: \"Inspect Ads and GMV Max Campaigns, run Campaign Copy tasks, select TikTok authorizations, manage automation rules, and apply single-Campaign status, budget, or ROAS changes safely. Use for every AdRate CLI advertising read or write operation.\"\n     4\t---\n     5\t\n     6\t# AdRate Ads Operations Contract\n     7\t\n     8\tUse this contract after `adrate-shared` for every AdRate CLI advertising task. Work only at the advertising account -> Campaign level, through Campaign Copy, or through automation rules. Do not perform independent Adgroup or Ad read/write operations.\n     9\t\n    10\t## Select the TikTok authorization\n    11\t\n    12\tStart by listing the advertiser and its authorization candidates:\n    13\t\n    14\t```sh\n    15\tadrate ads advertisers --json\n    16\t```\n    17\t\n    18\tRead `availableAuthorizations` and `authSelectionRequired`. When exactly one active authorization is valid, `--auth-id` may be omitted. When multiple candidates exist, choose one explicitly with `--auth-id`. If the task context cannot identify the intended authorization, present the safe candidates and ask the Owner once; never guess or silently select one.\n    19\t\n    20\t## Discover a GMV Max Campaign\n    21\t\n    22\tNever guess a GMV Max store or Campaign binding. Resolve the store and Campaign IDs from fresh data:\n    23\t\n    24\t```sh\n    25\tadrate gmvmax stores --adv-id 70001 --auth-id 42 --json\n    26\tadrate gmvmax campaigns list --adv-id 70001 --store-id shop-1 --promotion-type product --auth-id 42 --json\n    27\t```\n    28\t\n    29\tUse `gmvmax campaigns get` when the task needs fresh details for one selected Campaign:\n    30\t\n    31\t```sh\n    32\tadrate gmvmax campaigns get --adv-id 70001 --campaign-id 80001 --store-id shop-1 --auth-id 42 --json\n    33\t```\n    34\t\n    35\t`--promotion-type` accepts only `product` or `live`. `--from` and `--to` may narrow the list to one inclusive window of at most 30 days and must be supplied together. `--include-trend` adds the daily trend to the response; it does not avoid an upstream report call. The Campaign list is a bounded server-side aggregation: inspect `truncated` and `warning`, and never treat a partial result as complete. Reads may omit `--auth-id` only when the server has exactly one valid candidate. Every GMV Max Campaign status, budget, or ROAS write requires an explicit `--auth-id`.\n    36\t\n    37\t## Inspect before changing state\n    38\t\n    39\tFor performance review, use a report to locate a Campaign, then retrieve fresh Current State before acting:\n    40\t\n    41\t```sh\n    42\tadrate ads report campaigns --adv-id 70001 --auth-id 42 --start-date 2026-07-01 --end-date 2026-07-31 --group-by day --page 1 --page-size 100 --json\n    43\tadrate ads campaigns get --adv-id 70001 --campaign-id 80001 --auth-id 42 --json\n    44\t```\n    45\t\n    46\tOnly after the Owner's ENABLE/DISABLE intent is unambiguous may you submit one Status command:\n    47\t\n    48\t```sh\n    49\tadrate ads campaigns status --adv-id 70001 --campaign-id 80001 --set disable --auth-id 42 --idempotency-key campaign_80001_disable_001 --json\n    50\t```\n    51\t\n    52\tAfterward, inspect the returned Command DTO. Query only when `isFinal=false`, and use the original selector:\n    53\t\n    54\t```sh\n    55\tadrate commands get --idempotency-key campaign_80001_disable_001 --json\n    56\t```\n    57\t\n    58\tDo not infer success from HTTP 202, HTTP 200, or a process exit code alone. Evaluate the Command `status` and `isFinal` fields using the recovery rules in `adrate-shared`.\n    59\t\n    60\t## Adjust Campaign budget\n    61\t\n    62\tBudget adjustment follows the same Command model as Status: persist intent locally, send at most one POST, and recover from exit 5 via `commands get/pending/resume`.\n    63\t\n    64\tModes: `set` (absolute value), `increase_amount`, `decrease_amount`, `increase_percent`, `decrease_percent`. Relative adjustments (increase/decrease) are applied exactly once: the target budget is locked server-side after the first GET and never recalculated on retry or resume with the same idempotency key.\n    65\t\n    66\t```sh\n    67\tadrate ads campaigns budget --adv-id 70001 --campaign-id 80001 --mode set --value 300 --auth-id 42 --idempotency-key campaign_80001_budget_300 --json\n    68\tadrate ads campaigns budget --adv-id 70001 --campaign-id 80001 --mode increase_percent --value 20 --auth-id 42 --idempotency-key campaign_80001_incr20pct --json\n    69\t```\n    70\t\n    71\tThe value must be a positive number with at most two decimal places. The server enforces the budget ceiling and budget_mode eligibility; TikTok validates the account-currency minimum. Campaigns with infinite or missing adjustable budget are rejected with `BUDGET_NOT_ADJUSTABLE`. SPC Campaign budget changes are rejected with `SPC_CAMPAIGN_NOT_SUPPORTED` and must be completed through the AdRate Web interface.\n    72\t\n    73\t## Copy Campaigns through an asynchronous task\n    74\t\n    75\tPrepare one JSON file and keep copied Campaigns disabled by default. The server defaults `options.operationStatus` to `DISABLE`; tell the Owner that the copies will be disabled. Set it to `ENABLE` only after the Owner explicitly requests that outcome.\n    76\t\n    77\t`options.cleanupStrategy` controls cleanup of partially created Campaigns when the Worker fails mid-copy. Three values: `cleanup_if_empty` (default; delete created Campaign shell only if zero Adgroups succeed), `cleanup_if_partial` (delete even with partial Adgroup success), `no_cleanup` (preserve everything). Set `cleanup_if_partial` when the Owner prefers no leftover artifacts from failures.\n    78\t\n    79\tPreview before submitting:\n    80\t\n    81\t```sh\n    82\tadrate ads copy preview --file copy.json --json\n    83\t```\n    84\t\n    85\tRemove each Campaign reported in `unsupported` or with `perCampaign[].oversized=true`, then preview the corrected file again. Submit the same reviewed file. Preview is shallow advice: an empty `unsupported` array and absent or false `oversized` fields do not guarantee submit acceptance or Worker success.\n    86\t\n    87\t`oversized` is computed from a lower-bound estimate of the upstream calls submit will make. It does not include ACO material lookups, ENGAGEMENT backfill, or transport retries, so `oversized: false` does not rule out a submit that exhausts its upstream budget. Treat it as \"this file is already too large\" when true, never as \"this file will fit\" when false. A budget exhaustion happens before any task is created, so it is safe to reduce the file and submit again.\n    88\t\n    89\t```sh\n    90\tadrate ads copy submit --file copy.json --idempotency-key copy-20260808-1 --json\n    91\t```\n    92\t\n    93\tExit 0 means only that the Copy task was accepted, not completed. There is no `--wait` mode. Read the returned `taskId`, then query it every 30 seconds for at most 10 minutes:\n    94\t\n    95\t```sh\n    96\tadrate ads copy tasks get --task-id 42 --json\n    97\t```\n    98\t\n    99\tStop on `completed`, `failed`, or `partial`. If the limit expires while the task is still processing, report that it remains in progress. For `partial`, report every target item with its `targetAdvId`, item `status`, `error`, and `resultData`; within `resultData`, include each Campaign and Adgroup result and warning instead of summarizing the task as completed.\n   100\t\n   101\tUse the bare tasks command to read one list page; never add a `list` subcommand:\n   102\t\n   103\t```sh\n   104\tadrate ads copy tasks --status partial --page 1 --page-size 20 --json\n   105\t```\n   106\t\n   107\tCampaign Copy submit uses a receipt, not a Command journal. On a network failure, timeout, invalid response, or lost response, replay the original file unchanged with the original idempotency key. An explicit `INVALID_REQUEST`, `DAILY_QUOTA_EXCEEDED`, or `PLAN_LIMIT_EXCEEDED` rejection proves that no Copy task was accepted; correct the validation or quota issue and submit the corrected file with a new key. `commands get`, `commands pending`, and `commands resume` do not recover Copy submit.\n   108\t\n   109\t## Change one GMV Max Campaign\n   110\t\n   111\tAfter resolving the target from fresh store and Campaign data, submit at most one status, budget, or ROAS intent:\n   112\t\n   113\t```sh\n   114\tadrate gmvmax campaigns status --adv-id 70001 --campaign-id 80001 --set disable --auth-id 42 --idempotency-key gmv_80001_disable_001 --json\n   115\tadrate gmvmax campaigns budget --adv-id 70001 --campaign-id 80001 --mode set --value 500 --auth-id 42 --idempotency-key gmv_80001_budget_500 --json\n   116\tadrate gmvmax campaigns roas --adv-id 70001 --campaign-id 80001 --mode set --value 2.5 --auth-id 42 --idempotency-key gmv_80001_roas_25 --json\n   117\t```\n   118\t\n   119\tStatus accepts only `enable` or `disable`. Budget and ROAS use `set`, `increase_amount`, `decrease_amount`, `increase_percent`, or `decrease_percent`; values must be positive and `decrease_percent` must be below 100. Budget accepts at most two decimal places and ROAS at most one decimal place.\n   120\t\n   121\tAll three writes are Command-backed. Preserve the original idempotency key and recover uncertain outcomes through `commands get`, `commands pending`, or the qualified `commands resume` path. Never retry the same intent with a fresh key. GMV Max Campaign deletion is not available through the CLI; do not approximate it with status, budget, ROAS, or Rule operations.\n   122\t\n   123\t## Read and manage automation rules\n   124\t\n   125\tRules cover both Ads and GMV Max automation. All rule reads require an active subscription (including options queries).\n   126\t\n   127\tQuery available metrics, actions, and constraints for a given rule type and scope:\n   128\t\n   129\t```sh\n   130\tadrate rules options --rule-type ads --scope campaign --json\n   131\t```\n   132\t\n   133\tThe response is self-sufficient and machine-readable. `requestTemplate.body` is a structurally valid minimal create body for that exact rule type and scope, but it still carries placeholders: replace every `requestTemplate.placeholders` entry with a real value before submitting, or the server rejects the request. Build every new rule from it instead of copying an existing rule; a team with no rules yet needs no `rules get` call at all.\n   134\t\n   135\tList rules with optional filters:\n   136\t\n   137\t```sh\n   138\tadrate rules list --rule-type ads --json\n   139\tadrate rules list --keyword cpa --page 1 --page-size 50 --json\n   140\t```\n   141\t\n   142\tRead one rule with full pipeline, condition, and action detail:\n   143\t\n   144\t```sh\n   145\tadrate rules get --rule-id 42 --json\n   146\t```\n   147\t\n   148\tList execution records (at least one filter required):\n   149\t\n   150\t```sh\n   151\tadrate rules executions list --rule-id 42 --result success --json\n   152\tadrate rules executions list --scope-id 80001 --from 2026-08-01 --to 2026-08-07 --json\n   153\t```\n   154\t\n   155\tRead one execution with condition evaluation detail (each metric's threshold, actual value, time window, and result):\n   156\t\n   157\t```sh\n   158\tadrate rules executions get --execution-id 1001 --json\n   159\t```\n   160\t\n   161\tExecution records include per-action status and value changes. The evaluation detail is self-contained: it includes the scope name and each metric's actual value, so no additional data-plane query is needed to explain \"which object was hit and why\".\n   162\t\n   163\tRule writes support Ads, GMV Max product promotion, and GMV Max live promotion. Promotion type `product` maps exactly to rule type `gmv_max_product`; promotion type `live` maps exactly to `gmv_max_live`. Use `rules options` as the source of truth before every create or update; never invent metrics, operators, actions, scopes, or limits from memory.\n   164\t\n   165\tBefore creating a GMV Max rule or changing its targets, run `gmvmax stores` and `gmvmax campaigns list`; use `gmvmax campaigns get` only when current Campaign details are needed. Then query `rules options` with the exact mapped rule type and intended scope. A GMV Max rule requires `authId`; every target uses `targetType: \"campaign\"` with `advId` and `shopId`. Include `campaignId` for a Campaign-bound target, or omit it for a full-store target. Do not send timezone in the effective window or targets: the server derives it from account data. GMV Max Rule budget action values accept at most two decimal places and ROAS action values at most one; values must be positive and percentage decreases must be below 100.\n   166\t\n   167\t### Manage upgraded Smart+ creative materials\n   168\t\n   169\tTreat Ads scope `material` as the internal Rule scope for the UI's \"创意素材\", not as a GMV Max creative scope or a raw material-library identifier. Before every create or update, query its current server contract:\n   170\t\n   171\t```sh\n   172\tadrate rules options --rule-type ads --scope material --json\n   173\t```\n   174\t\n   175\tTake metrics, operators, actions, limits, and request shape from that response. Apply these material-specific invariants:\n   176\t\n   177\t- Treat `scopeId` and `targetId` as `smart_plus_creative_id`, which is the Integrated `ad_id`. Do not substitute Smart+ ad-group or library-material ids.\n   178\t- Keep `smartPlusAdId` and `adMaterialId` distinct when `materialMapping` is returned; preserve the mapping when explaining a dry run or execution.\n   179\t- Use only `ENABLE` or `DISABLE` for the material operation. Use `day` or `lifetime` time windows and never `hour`. Omit `targetStatuses` entirely; do not send an empty array.\n   180\t- Dry-run with the Ads account parameter `--adv-id` only. Do not pass GMV Max `--shop-id` or `--campaign-id` context.\n   181\t\n   182\tCreate material rules disabled, dry-run them, show the Owner the named targets and `materialMapping`, and enable only after explicit confirmation. Inspect explicit dry-run errors and the complete JSON response; never assume an incomplete target/page/budget result is a valid partial evaluation. Every material write follows the existing preview, confirmation, idempotency-key, and receipt-replay safety chain in this Skill.\n   183\t\n   184\t### Build the rule body\n   185\t\n   186\tStart from `requestTemplate.body`, replace every entry listed in `requestTemplate.placeholders` with a real value, then adjust the metrics, operators, values, and actions to the requested intent. Never submit a body that still contains a placeholder such as `\u003cadvertiser-id>` or `\u003cstore-id>`, and never invent a field: any key outside the template contract is rejected with `UNKNOWN_FIELD`.\n   187\t\n   188\t`requestTemplate.fields` states each top-level field as `required`, `optional`, or `forbidden` for the queried rule type. Read it per rule type instead of reusing one body across families, because the two families are deliberately asymmetric: for Ads, `authId` is forbidden and the server resolves the authorization itself, while `targets`, `labelIds`, and `targetStatuses` are optional; for GMV Max, `authId` and `targets` are required, and `labelIds` and `targetStatuses` are forbidden. An Ads rule with neither `targets` nor `labelIds` is still created but cannot be enabled.\n   189\t\n   190\tA complete Ads example with one pipeline, mixed AND/OR conditions, and one relative budget action:\n   191\t\n   192\t```json\n   193\t{\n   194\t  \"ruleType\": \"ads\",\n   195\t  \"scope\": \"campaign\",\n   196\t  \"name\": \"Cut spend on weak campaigns\",\n   197\t  \"triggerMode\": \"repeat\",\n   198\t  \"checkIntervalMinutes\": 30,\n   199\t  \"targetStatuses\": [\"STATUS_DELIVERY_OK\"],\n   200\t  \"effectiveWindow\": { \"start\": \"09:00\", \"end\": \"21:00\", \"timezone\": \"America/Los_Angeles\" },\n   201\t  \"targets\": [{ \"targetType\": \"ad_account\", \"advId\": \"70001\" }],\n   202\t  \"pipelines\": [\n   203\t    {\n   204\t      \"name\": \"High spend, weak return\",\n   205\t      \"conditions\": {\n   206\t        \"all\": [\n   207\t          { \"metric\": \"spend\", \"operator\": \"greater\", \"value\": 200, \"timeWindow\": { \"granularity\": \"day\", \"fromDaysAgo\": 0, \"toDaysAgo\": 0 } },\n   208\t          {\n   209\t            \"any\": [\n   210\t              { \"metric\": \"complete_payment_roas\", \"operator\": \"less\", \"value\": 1.5, \"timeWindow\": { \"granularity\": \"day\", \"fromDaysAgo\": 6, \"toDaysAgo\": 0 } },\n   211\t              { \"metric\": \"cpa\", \"operator\": \"greater\", \"value\": 30, \"timeWindow\": { \"granularity\": \"lifetime\" } }\n   212\t            ]\n   213\t          },\n   214\t          { \"metric\": \"campaign_name\", \"operator\": \"like\", \"value\": \"US-\" }\n   215\t        ]\n   216\t      },\n   217\t      \"actions\": [{ \"kind\": \"basic\", \"type\": \"budget:dec:%\", \"value\": \"20\" }]\n   218\t    }\n   219\t  ]\n   220\t}\n   221\t```\n   222\t\n   223\tThe same shape for GMV Max product promotion, with the required `authId`, one Campaign-bound target, and a Session action. Both bodies are syntactically valid samples rather than recommendations, and a rule body file must be plain JSON without comments:\n   224\t\n   225\t```json\n   226\t{\n   227\t  \"ruleType\": \"gmv_max_product\",\n   228\t  \"scope\": \"product\",\n   229\t  \"name\": \"Boost profitable products\",\n   230\t  \"authId\": 42,\n   231\t  \"checkIntervalMinutes\": 60,\n   232\t  \"effectiveWindow\": { \"start\": \"08:00\", \"end\": \"23:00\" },\n   233\t  \"targets\": [\n   234\t    { \"targetType\": \"campaign\", \"advId\": \"70001\", \"shopId\": \"shop-1\", \"campaignId\": \"80001\" }\n   235\t  ],\n   236\t  \"pipelines\": [\n   237\t    {\n   238\t      \"name\": \"Profitable products\",\n   239\t      \"conditions\": {\n   240\t        \"all\": [\n   241\t          { \"metric\": \"roi\", \"operator\": \"greater_or_equal\", \"value\": 2, \"timeWindow\": { \"granularity\": \"hour\", \"lookbackHours\": 3 } },\n   242\t          { \"metric\": \"orders\", \"operator\": \"greater\", \"value\": 5, \"timeWindow\": { \"granularity\": \"day\", \"fromDaysAgo\": 0, \"toDaysAgo\": 0 } }\n   243\t        ]\n   244\t      },\n   245\t      \"actions\": [\n   246\t        {\n   247\t          \"kind\": \"session\",\n   248\t          \"type\": \"product_session:create_no_bid\",\n   249\t          \"params\": { \"budget\": 50, \"scheduleType\": \"SCHEDULE_START_END\", \"durationValue\": 2, \"durationUnit\": \"hours\" }\n   250\t        }\n   251\t      ]\n   252\t    }\n   253\t  ]\n   254\t}\n   255\t```\n   256\t\n   257\tCondition and action syntax:\n   258\t\n   259\t- A condition group carries exactly one of `all` (AND) or `any` (OR), whose value is a non-empty array of child nodes; no other key may sit beside it. Groups nest, and exceeding the accepted depth returns `CONDITION_TREE_TOO_DEEP`. A single leaf may also stand alone as `conditions`.\n   260\t- A leaf is `{ metric, operator, value, timeWindow? }`. Take `metric` from `metrics[]` and `operator` from that metric's own `operators` list, never from the shared `operators` map, which only groups operators by metric family.\n   261\t- The `value` type follows the metric type: a number or numeric string for `numeric`, `attribute`, and `time` metrics; a non-empty string for `text`; one of the metric's `enumValues` for `enum`; and a comma-separated id string for the `in` and `not_in` operators.\n   262\t- Send `timeWindow` for every metric whose `timeWindowRequired` is true; omitting it returns `REQUIRED`.\n   263\t- An action is `{ kind: \"basic\", type, value? }`, or `{ kind: \"session\", type, params }` when that action's `needsSessionParams` is true; `kind` must match the action exactly. Include `value` only when `needsValue` is true, and send it as a decimal string, not a number. Session `params` follow the action's own `sessionParamsSchema`.\n   264\t\n   265\tTime window syntax, one shape per granularity:\n   266\t\n   267\t- `{ \"granularity\": \"day\", \"fromDaysAgo\": N, \"toDaysAgo\": M }` is an inclusive whole-day window. `fromDaysAgo` is the older bound and must be greater than or equal to `toDaysAgo`; `0` means today.\n   268\t- `{ \"granularity\": \"hour\", \"lookbackHours\": N }` covers the trailing N hours.\n   269\t- `{ \"granularity\": \"lifetime\" }` carries no other key.\n   270\t\n   271\tSupported granularity depends on both rule type and scope. `constraints.timeWindow` in the same `rules options` response is the machine-readable source of truth for the granularity set and its numeric bounds:\n   272\t\n   273\t| Rule type and scope | Granularities | Numeric bounds |\n   274\t| --- | --- | --- |\n   275\t| Ads campaign, adgroup, ad | `day`, `lifetime` | day 0 to 90 |\n   276\t| Ads material | `day`, `lifetime` | query `constraints.timeWindow` |\n   277\t| GMV Max campaign, product, live_room | `day`, `hour` | day 0 to 30, hour 1 to 24 |\n   278\t| GMV Max creative | `day` | day 0 to 30 |\n   279\t\n   280\tAds rejects every `hour` window and GMV Max rejects every `lifetime` window with `UNSUPPORTED_TIME_WINDOW`. Some Ads metrics reject `lifetime` individually, marked by `supportsLifetime: false` on the metric. `timeWindowPresets` lists ready-made windows already filtered for the queried scope; a custom window is accepted whenever it satisfies `constraints.timeWindow`.\n   281\t\n   282\t### Create, review, and enable\n   283\t\n   284\tFollow this order for every new rule:\n   285\t\n   286\t1. Discover the target, query its exact rule type and scope with `rules options`, and build the body from `requestTemplate` as described above.\n   287\t2. Create one rule. Creation always returns `enabled=false`.\n   288\t3. Dry-run the disabled rule against one bound Campaign and show the Owner the returned targets, hits, and evaluation evidence.\n   289\t4. Enable only after the Owner explicitly confirms the shown result.\n   290\t\n   291\t```sh\n   292\tadrate rules options --rule-type ads --scope campaign --json\n   293\tadrate rules create --file rule.json --idempotency-key rule-create-0198f001 --json\n   294\tadrate rules dryrun --rule-id 42 --adv-id 70001 --json\n   295\tadrate rules enable --rule-id 42 --idempotency-key rule-enable-0198f002 --json\n   296\t```\n   297\t\n   298\tFor a GMV Max rule, use the mapped type and pass all four dry-run fields:\n   299\t\n   300\t```sh\n   301\tadrate rules options --rule-type gmv_max_product --scope campaign --json\n   302\tadrate rules dryrun --rule-id 43 --adv-id 70001 --shop-id shop-1 --campaign-id 80001 --json\n   303\t```\n   304\t\n   305\tA full-store rule target omits `campaignId`, but dry run always evaluates one Campaign and therefore requires both `--shop-id` and `--campaign-id`.\n   306\t\n   307\tDry run has no idempotency key because it does not mutate a rule. If it returns `notice: \"busy\"`, wait and retry later with bounded backoff; do not treat busy as a failed rule execution.\n   308\t\n   309\t### Update or delete\n   310\t\n   311\tBefore updating, read the current rule, query `rules options` for its exact scope, and apply only the requested patch. An update body is a top-level patch over the same fields as create except `ruleType`: each supplied field replaces the stored value outright, each omitted field is left untouched, and an empty patch is rejected. There is no deep merge, so a `pipelines` patch must carry the complete pipeline array. Take current values from `rules get` and legal shapes from `rules options`. Do not change its enabled state unless the Owner asked for that change. A disabled rule may be dry-run after the update; enabling it still requires explicit confirmation.\n   312\t\n   313\t```sh\n   314\tadrate rules get --rule-id 42 --json\n   315\tadrate rules update --rule-id 42 --file patch.json --idempotency-key rule-update-0198f004 --json\n   316\tadrate rules dryrun --rule-id 42 --adv-id 70001 --json\n   317\t```\n   318\t\n   319\tDelete a rule only after the Owner explicitly confirms deletion:\n   320\t\n   321\t```sh\n   322\tadrate rules delete --rule-id 42 --idempotency-key rule-delete-0198f005 --json\n   323\t```\n   324\t\n   325\tWhen the team is `frozen`, `rules disable` and `rules delete` remain available for risk reduction. `rules create`, `rules update`, and `rules enable` are unavailable.\n   326\t\n   327\tRun `adrate schema \u003ccapabilityId> --json` to read each operation's own `available`, `unavailableReason`, and `idempotencyRequired` fields. `availabilityMode` summarizes availability only: `availabilityMode: \"mixed\"` means operations under that capability differ in availability, so read each operation's own fields. `availabilityMode: \"uniform\"` means they agree on availability — it does not mean they agree on `idempotencyRequired` or any other per-operation setting, which can still differ. Always take idempotency requirements from the operation you are about to call, never from the capability-level summary.\n   328\t\n   329\t### Replay Rule write receipts safely\n   330\t\n   331\tRule writes use lightweight receipts, not the Command journal. Let the CLI generate an operation-prefixed key, or use the matching namespace: `rule-create-*`, `rule-update-*`, `rule-enable-*`, `rule-disable-*`, or `rule-delete-*`. Never reuse a key across operations or for changed input.\n   332\t\n   333\t- On a confirmed non-retryable rejection that proves no mutation ran, correct each returned `validationErrors` item or resolve the stated business constraint, then retry with a new key.\n   334\t- On a network failure, timeout, invalid response, or lost response, replay the exact same request with the original key. Do not change the body, target, or operation.\n   335\t- `duplicate: true` means the server returned the original receipt; it does not mean a second mutation ran.\n   336\t\n   337\t`commands get`, `commands pending`, and `commands resume` apply only to Command-backed Campaign Status, Budget, and ROAS writes. They cannot recover a Rule write. Never build a polling loop that scans Campaigns and issues bulk writes.\n   338\t\n   339\t## Keep both conversion-rate definitions explicit\n   340\t\n   341\t- `conversionRate` is the click-based conversion rate: conversion count divided by destination-page click count. TikTok has announced that this metric's definition will change, so preserve the API value and label it explicitly as click-based.\n   342\t- `conversionRateV2` is the impression-based conversion rate: conversion count divided by total impressions. It is the recommended CVR to display.\n   343\t- Never mix the two rates, use one to validate the other, or shorten both labels to the same generic \"conversion rate\".\n   344\t\n   345\t## Preserve values and reporting limits\n   346\t\n   347\tDisplay `spend`, currency amounts, and ratio fields as their original strings so precision is not lost. `null` means N/A, never zero. Do not add monetary values across different currencies. Reports are delayed, can receive attribution backfill, and can be truncated. Read `meta.pagination` and fetch only the pages the task needs; do not automatically download everything or simply average row-level ratios.\n   348\t\n   349\t## Keep Campaign writes server-owned\n   350\t\n   351\tStatus accepts only `--set enable` or `--set disable`, corresponding to ENABLE/DISABLE intent. Budget and GMV Max ROAS accept `--mode` and `--value`; the server reads current state, locks the target, and applies the change. The CLI must not send `currentStatus`, `automationType`, `before`, or `after`; the server obtains fresh state and computes those fields. Do not attempt to reproduce the state machine locally.\n   352\t\n   353\t## CLI exclusions\n   354\t\n   355\tDo not use the CLI for standalone Campaign creation or Campaign deletion, batch operations, bid changes, independent Adgroup writes, independent Ad writes, Adgroup Copy, or Campaign Copy task cancellation. Use the documented `adrate rules` commands for supported Ads and GMV Max Rule creation, update, enable, disable, deletion, and dry run. GMV Max Campaign deletion remains unavailable even though confirmed Rule deletion is supported. Do not repurpose any supported Status, Budget, ROAS, Campaign Copy, or Rule command to approximate an excluded operation, and do not use undocumented endpoints."}], <script>
/**
 * 数据由 replay.ts 注入：完整时间线 + 每轮的重算结果（可见 seq、估算 token、有损落点、真实用量）。
 * 页面只负责渲染，不含任何 reins 逻辑 —— 这样任何人拿到 JSONL 都能自己画一份。
 */
const data = JSON.parse(document.getElementById("replay-data").textContent)
const $ = (id) => document.getElementById(id)
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n }
const t0 = data.events[0].at
const rel = (at) => `+${((at - t0) / 1000).toFixed(2)}s`
const short = (t) => t.replace("core.", "")
const textOf = (parts) => Array.isArray(parts) ? parts.map((x) => x.type === "text" ? x.text : `[${x.type}]`).join(" ") : String(parts)

function preview(e) {
  const p = e.payload
  switch (e.type) {
    case "core.user_message": return textOf(p.content)
    case "core.model_text": return p.text
    case "core.model_thinking": return p.text || "（加密思考，只有回放签名）"
    case "core.tool_call": return `${p.name}(${JSON.stringify(p.args)})`
    case "core.tool_result": return `${p.name} → ${textOf(p.content)}`
    case "core.approval_request": return `需要审批：${p.summary}（策略 ${p.policyId}）`
    case "core.approval_decision": return `${p.approved ? "✅ 批准" : "⛔ 拒绝"}，by ${p.by}${p.reason ? `：${p.reason}` : ""}`
    case "core.budget_usage": return `tokens in ${p.tokens.input} / out ${p.tokens.output}${p.tokens.cacheRead ? ` (缓存读 ${p.tokens.cacheRead})` : ""} · 工具 ${p.toolCalls} 次 · ${p.wallMs} ms`
    case "core.run_paused": return `run 暂停，原因：${p.reason}`
    case "core.run_resumed": return `run 恢复${p.by ? `，by ${p.by}` : ""}`
    case "core.system_note": return `[${p.kind}] ${p.text}`
    case "core.compaction": return `折叠 seq ${p.coversSeq.join("~")}（${p.decidedBy}）：${p.summary}`
    case "core.handoff": return `交接到 ${p.toSessionId}：${p.summary}`
    case "core.error": return `${p.category}：${p.message}`
    default: return JSON.stringify(p)
  }
}

// ---- 渲染 ----
const main = $("main")
const rows = new Map() // seq → 节点
const turnBySeq = new Map(data.turns.filter((t) => t.firstOutputSeq !== null).map((t) => [t.firstOutputSeq, t]))
// 口径：厂商报的 input 不含缓存命中的部分，真正进模型的输入 = input + cacheRead
const usage = data.turns.reduce((a, t) => ({ i: a.i + (t.usage?.tokens.input ?? 0), c: a.c + (t.usage?.tokens.cacheRead ?? 0), o: a.o + (t.usage?.tokens.output ?? 0) }), { i: 0, c: 0, o: 0 })
const n = (type) => data.events.filter((e) => e.type === type).length
$("sid").textContent = data.sessionId
$("model").textContent = `${data.model.provider}/${data.model.id}`
$("summary").textContent = `${data.events.length} 条事件 · ${data.turns.length} 轮模型调用 · ${n("core.tool_call")} 次工具 · ${n("core.approval_request")} 次审批 · 用时 ${((data.events.at(-1).at - t0) / 1000).toFixed(1)}s · 输入 ${usage.i + usage.c} token（其中缓存命中 ${usage.c}）· 输出 ${usage.o}`

for (const e of data.events) {
  const turn = turnBySeq.get(e.seq)
  if (turn) main.append(turnCard(turn))
  const row = el("div", `ev${e.type === "core.error" || e.payload?.isError ? " error" : ""}`)
  row.dataset.actor = e.actor
  row.dataset.seq = e.seq
  const body = el("div", `body${e.type === "core.model_thinking" ? " thinking" : ""}`, preview(e))
  row.append(el("span", "seq", e.seq), el("span", "t", rel(e.at)), el("span", "actor", e.actor), el("span", "type", short(e.type)), body)
  row.onclick = () => {
    const open = row.querySelector("pre")
    if (open) return open.remove()
    const full = { ...e }
    body.append(Object.assign(el("pre"), { textContent: JSON.stringify(full, null, 2) }))
  }
  rows.set(e.seq, row)
  main.append(row)
}

function turnCard(t) {
  const card = el("div", "turn")
  const seqs = t.visibleSeqs
  const l = t.landings
  const loss = l.lossy + l.dropped > 0 ? `有损 ${l.lossy} / 丢弃 ${l.dropped}` : "全部 exact"
  const u = t.usage ? ` · 实际用量 in ${t.usage.tokens.input} / out ${t.usage.tokens.output} · ${t.usage.wallMs} ms` : ""
  card.append(el("b", null, `第 ${t.index} 轮`), el("span", null, ` · 模型看到 ${seqs.length} 条（seq ${seqs[0]}~${seqs.at(-1)}，约 ${t.estimatedTokens} token / 窗口 ${data.contextWindow}）· 落点 ${loss}${u}`))
  if (l.notes.length) card.append(el("div", "notes", l.notes.map((x) => `↳ ${x}`).join("\n")))
  if (t.diverged) card.append(el("div", "warn", "⚠ 用现在的投影规则重算，与当时发生的不一致（策略或估算变了）"))
  card.onclick = () => focusTurn(t, card)
  return card
}

// ---- 聚焦某一轮：高亮它看到的，压暗它看不到的与之后才发生的 ----
let active = null
function focusTurn(t, card) {
  document.querySelectorAll(".turn.active").forEach((c) => c.classList.remove("active"))
  if (active === t) { active = null; document.body.classList.remove("focus"); rows.forEach((r) => r.classList.remove("seen", "unseen", "later")); return }
  active = t
  card.classList.add("active")
  document.body.classList.add("focus")
  const seen = new Set(t.visibleSeqs)
  rows.forEach((r, seq) => {
    r.classList.remove("seen", "unseen", "later")
    r.classList.add(seq > t.requestAtSeq ? "later" : seen.has(seq) ? "seen" : "unseen")
  })
  card.scrollIntoView({ block: "center", behavior: "smooth" })
}

// ---- 发起者过滤 ----
document.querySelectorAll("input[data-actor]").forEach((box) => {
  box.onchange = () => rows.forEach((r) => { if (r.dataset.actor === box.dataset.actor) r.classList.toggle("hidden-actor", !box.checked) })
})

// ---- 重放：按真实间隔比例逐条出现，整段压到 8 秒内，单步不超过 1.2 秒 ----
let timer = null
$("play").onclick = () => {
  if (timer) { clearTimeout(timer); timer = null }
  rows.forEach((r) => r.classList.add("not-yet"))
  document.querySelectorAll(".turn").forEach((c) => (c.style.display = "none"))
  const total = Math.max(1, data.events.at(-1).at - t0)
  const scale = Math.min(1, 8000 / total)
  let i = 0
  const step = () => {
    const e = data.events[i]
    if (!e) { timer = null; return }
    const card = rows.get(e.seq).previousElementSibling
    if (card?.classList.contains("turn")) card.style.display = ""
    rows.get(e.seq).classList.remove("not-yet")
    rows.get(e.seq).scrollIntoView({ block: "nearest" })
    i++
    const next = data.events[i]
    if (next) timer = setTimeout(step, Math.min(1200, Math.max(120, (next.at - e.at) * scale)))
  }
  step()
}
$("all").onclick = () => {
  if (timer) { clearTimeout(timer); timer = null }
  rows.forEach((r) => r.classList.remove("not-yet"))
  document.querySelectorAll(".turn").forEach((c) => (c.style.display = ""))
}
</script>
